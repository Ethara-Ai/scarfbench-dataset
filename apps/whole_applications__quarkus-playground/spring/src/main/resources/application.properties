# server
server.port=8080
spring.application.name=quarkus-playground

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/quarkusdb
spring.datasource.username=quarkus
spring.datasource.password=quarkus
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.maximum-pool-size=16

# jpa / hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# flyway (migrate at start)
spring.flyway.enabled=true

# jackson (parity with Quarkus ObjectMapperCustomizer)
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# actuator: expose health at /health (+/health/live, /health/ready) and prometheus at /metrics
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.group.live.include=ping
management.endpoint.health.group.ready.include=ping,db

# jwt
acme.jwt.issuer=https://quarkus.io/using-jwt-rbac
acme.jwt.public-key-location=classpath:publicKey.pem
