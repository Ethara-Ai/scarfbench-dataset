# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Preserve the original TomEE CookieProcessor sameSiteCookies="strict" behaviour
quarkus.http.same-site-cookie.JSESSIONID.value=strict

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# The original application relied on a container-managed JNDI DataSource
# (jdbc/TreenDB) backed by MySQL/MariaDB. For a self-contained, runnable image
# the datasource is provided by Quarkus/Agroal. H2 runs in MySQL-compatibility
# mode so the MySQL-dialect DDL/queries and Flyway migrations work out of the box.
# To target a real MySQL/MariaDB instance in production, override the properties
# below (or set the QUARKUS_DATASOURCE_* environment variables) and swap
# quarkus-jdbc-h2 for quarkus-jdbc-mysql / quarkus-jdbc-mariadb.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:treen;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=8

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.dmytrobilokha.treen".level=INFO
