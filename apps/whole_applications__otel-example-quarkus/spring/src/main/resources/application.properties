# Application Configuration
spring.application.name=otel-quarkus-crud

# HTTP Configuration
server.port=8080
server.address=0.0.0.0

# Database Configuration - H2 (Development)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=16

# Hibernate Configuration
# create-drop mirrors Quarkus drop-and-create; Hibernate auto-runs classpath import.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Match Quarkus's Hibernate default (pooled-lo) so seeded sequence RESTART WITH 6 yields positive ids
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo

# OpenTelemetry Configuration (opentelemetry-spring-boot-starter)
otel.sdk.disabled=false
otel.resource.attributes=service.name=otel-quarkus-crud,service.version=1.0.0,deployment.environment=development

# OTLP Exporter Configuration (gRPC on 4317, matching the Quarkus setup)
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc

# Tracing Configuration
otel.traces.sampler=always_on

# Logging Configuration
logging.level.root=INFO
logging.level.br.com.arquivolivre=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level traceId=%X{trace_id}, spanId=%X{span_id} [%logger{36}] (%thread) %msg%n

# Health Check Configuration (actuator under /q to preserve the Quarkus /q/health URL)
management.endpoints.web.base-path=/q
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI/Swagger Configuration (preserve Quarkus /q/openapi and /q/swagger-ui paths)
springdoc.api-docs.path=/q/openapi
springdoc.swagger-ui.path=/q/swagger-ui

#---
spring.config.activate.on-profile=prod
# Production profile configuration (activated via SPRING_PROFILES_ACTIVE=prod)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
otel.exporter.otlp.endpoint=http://alloy:4320
otel.resource.attributes=service.name=otel-quarkus-crud,service.version=1.0.0,deployment.environment=production
