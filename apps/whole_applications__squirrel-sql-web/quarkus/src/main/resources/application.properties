# ---------------------------------------------------------------------------
# Quarkus configuration for squirrel-sql-web (migrated from JavaEE/JAX-RS WAR)
# ---------------------------------------------------------------------------

# HTTP: listen on all interfaces, port 8080 (matches the original Glassfish port
# and the container's EXPOSE / -p 0:8080 mapping).
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# During @QuarkusTest use a random free port so tests never collide with a
# container already published on the fixed test port 8081.
quarkus.http.test-port=0

# The application is a headless server; force AWT/Swing headless mode because the
# SQuirreL SQL core it embeds is a desktop (Swing) application.
quarkus.native.additional-build-args=

# Keep the app running even though the embedded SQuirreL core pulls in a very
# large, old dependency tree. Do not let unindexable legacy jars fail the build.
quarkus.arc.remove-unused-beans=false

# The original app was served under the Glassfish context root
# "/squirrel-sql-web"; the REST base path "/ws" is defined by @ApplicationPath.
# Static frontend (if built) would be served from META-INF/resources.

# Logging: the SQuirreL core uses log4j 1.2; keep Quarkus console logging at INFO.
quarkus.log.level=INFO
quarkus.log.category."net.sourceforge.squirrel_sql".level=INFO
