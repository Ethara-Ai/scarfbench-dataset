quarkus.application.name = person-service
quarkus.application.version = 1.0

# Self-contained in-memory H2 datasource (ScarfBench runnable target).
quarkus.datasource.db-kind = h2
quarkus.datasource.jdbc.url = jdbc:h2:mem:persons;DB_CLOSE_DELAY=-1

# Schema + seed data are owned by Liquibase; Hibernate must not touch DDL.
quarkus.hibernate-orm.database.generation = none
quarkus.liquibase.migrate-at-start = true
quarkus.liquibase.change-log = db/changeLog.sql
