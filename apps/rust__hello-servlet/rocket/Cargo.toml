[package]
name = "hello_servlet_rocket"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello_servlet_rocket"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
