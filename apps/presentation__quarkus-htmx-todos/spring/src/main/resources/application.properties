# ScarfBench variant configuration — quarkus-htmx-todos / spring
#
# Migrated by intent, not by mechanical key translation. Every block below names the source
# key it answers; where a source key has no target counterpart, that is stated rather than
# left as a silent omission (checklist C1).

# quarkus.http.port -> server.port. The internal port is 8080 for Spring and Quarkus
# variants and 9080 for Jakarta ones (F8). Nothing is published to the host.
server.port=8080

##################################################
# Datasource: quarkus.datasource.* -> spring.datasource.*
#
# Both variants use H2 in-memory (see the source variant's pom header for why it is not
# PostgreSQL). DB_CLOSE_DELAY=-1 keeps the database alive for the life of the JVM rather
# than the life of the first connection — Quarkus's Agroal pool and Spring's HikariCP both
# close connections aggressively enough for that to matter.
#
# quarkus.datasource.jdbc.max-size=16 is Agroal's pool ceiling; HikariCP's equivalent is
# maximum-pool-size, so the number is carried over rather than dropped.
spring.datasource.url=jdbc:h2:mem:todos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=todos
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=16

##################################################
# Schema ownership: quarkus.flyway.migrate-at-start / quarkus.hibernate-orm.database
# .generation=none -> Flyway owns the schema, Hibernate validates nothing and creates
# nothing.
#
# ddl-auto is stated explicitly even though Spring Boot would infer `none` from Flyway's
# presence: the source says out loud that Hibernate does not touch the schema, and an
# implicit default is not the same statement. Without it, an embedded datasource would
# otherwise default to create-drop and silently take the schema away from Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

##################################################
# No target counterpart:
#
#   quarkus.qute.content-types.ts-html=text/vnd.turbo-stream.html
#       An upstream leftover from the sibling Hotwire application. No template produces a
#       Turbo Stream response, and Thymeleaf has no per-extension content-type registry.
#       Dropped, deliberately, with nothing observable lost.
#
#   quarkus.package.type=fast-jar
#       A Quarkus packaging mode. The target's packaging is the Boot executable jar, which
#       is a build concern expressed in pom.xml, not a runtime property.

##################################################
# quarkus.log.category."todos".level=DEBUG -> logging.level.todos=DEBUG
logging.level.todos=DEBUG

##################################################
# Two settings the source framework did not need, stated here because the target's defaults
# would otherwise change observable behaviour (C1: settings the source auto-configured
# implicitly must be stated explicitly in the target).
#
#   use-relative-redirects — the source's redirects carry a relative Location ("/todos").
#   The servlet container resolves a relative sendRedirect() to an absolute URL by default,
#   which would make every redirect answer with http://host:8080/todos instead. The
#   Location header is part of the contract, so the container is told not to.
server.tomcat.use-relative-redirects=true
#
#   open-in-view — off. The source has no request-scoped persistence session: its rendering
#   happens outside the transaction, on data already loaded. Leaving Spring's default on
#   would allow queries during view rendering, which is a behaviour the source does not have.
spring.jpa.open-in-view=false
