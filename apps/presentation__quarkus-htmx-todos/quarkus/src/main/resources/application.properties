# ScarfBench variant configuration — quarkus-htmx-todos / quarkus
#
# The internal port is 8080 for Spring and Quarkus variants and 9080 for Jakarta ones
# (checklist F8). Nothing is published to the host; the oracle runs inside the container.
quarkus.http.port=8080

##################################################
# Datasource.
#
# Upstream is PostgreSQL over Compose. The focused tier is a single application
# container, so the driver and the URL move to H2 in-memory; DB_CLOSE_DELAY=-1 keeps the
# database alive for the life of the JVM rather than the life of the first connection.
# The Flyway migrations, the entity model and the UUID primary key are untouched.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=todos
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:todos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.max-size=16

##################################################
# The schema is owned by Flyway, not by Hibernate: db/migration/V1 creates TODOS and V2
# adds CREATED_TIMESTAMP. Migration runs before the first request is served, so a freshly
# started container always presents the same (empty) initial state — which is what makes
# the oracle repeatable.
quarkus.flyway.migrate-at-start=true

# Upstream writes this as the deprecated quarkus.package.type; the current key is used here
# so the runtime does not log "Unrecognized configuration key" on every start. Same intent,
# same packaging: target/quarkus-app/ (B5).
quarkus.package.jar.type=fast-jar

##################################################
# Upstream leftover from the sibling Hotwire application: it registers a content type for
# Turbo Stream responses. No template in this application produces one, and there is no
# equivalent key in the Spring variant. Kept rather than quietly dropped so the
# configuration inventory (Gate C1) has something real to account for.
quarkus.qute.content-types.ts-html=text/vnd.turbo-stream.html

##################################################
# Application logging.
quarkus.log.category."todos".level=DEBUG
